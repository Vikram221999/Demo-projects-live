<div class="cinematic-container">
  <!-- The Surprise Intro -->
  <div class="intro-screen">
    <h2 class="intro-text">I have a surprise for you...</h2>
  </div>

  <!-- The Main Reveal -->
  <div class="reveal-content">

    <!-- Heart Shower -->
    <div class="heart-shower">
      <div class="falling-heart" style="--delay: 0s; --left: 10%;">❤️</div>
      <div class="falling-heart" style="--delay: 2s; --left: 20%;">💖</div>
      <div class="falling-heart" style="--delay: 1s; --left: 30%;">❤️</div>
      <div class="falling-heart" style="--delay: 3s; --left: 40%;">💕</div>
      <div class="falling-heart" style="--delay: 0.5s; --left: 50%;">❤️</div>
      <div class="falling-heart" style="--delay: 2.5s; --left: 60%;">💖</div>
      <div class="falling-heart" style="--delay: 1.5s; --left: 70%;">❤️</div>
      <div class="falling-heart" style="--delay: 3.5s; --left: 80%;">💕</div>
      <div class="falling-heart" style="--delay: 0.2s; --left: 90%;">❤️</div>
    </div>

    <!-- The Quote -->
    <div class="glass-card">
      <h1 class="quote-text">
        "In all the world, there is no heart for me like yours. <br>
        In all the world, there is no love for you like mine."
      </h1>

      <!-- The Name -->
      <div class="name-container">
        <span class="for-you">Forever Yours,</span>
        <h2 class="kavica-name">Kavica</h2>
      </div>
    </div>

  </div>
</div>
